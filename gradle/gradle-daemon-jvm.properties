# Java version that runs the Gradle daemon. Any vendor's JDK 21 is accepted: Android Studio's
# bundled JBR locally, Temurin on GitHub Actions (see .github/workflows/release.yml).
# Android Studio's "updateDaemonJvm" would pin the JetBrains JDK and add download URLs; GitHub
# Actions cannot download that one, so keep only the version here.
toolchainVersion=21
