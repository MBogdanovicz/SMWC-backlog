# Builds, tests and publishes a signed release APK when a version tag (v1.2.3) is pushed.
# Obtainium on the devices picks up the APK attached to the GitHub release.
#
# Safety:
# - Only people who can push tags to this repository can start it (not forks or pull requests).
# - The job runs in the "release" environment, which requires the owner's approval in GitHub
#   before it starts; the signing key and passwords are secrets of that environment only.
# - Third-party actions are pinned to exact commits (the version is in the comment).
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tags must look like v1.2.3, got $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Restore the release key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build the signed APK
        env:
          SMWC_STORE_FILE: ${{ runner.temp }}/release.jks
          SMWC_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SMWC_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SMWC_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleRelease -PappVersion="${GITHUB_REF_NAME#v}" --console=plain

      - name: Check the APK is signed with the release key
        env:
          # The release certificate's SHA-256 (public). Devices only accept updates signed with it.
          RELEASE_CERT_SHA256: a41155ff169886f7d97132da7a2921f76b1bd51383c23f805d1f0931a03d4eb9
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [[ ! -f "$apk" ]]; then
            echo "::error::No signed APK (the signing secrets are missing or wrong)"
            exit 1
          fi
          # The runner has several build-tools versions: use the newest one's apksigner.
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          certs=$("${build_tools}apksigner" verify --print-certs "$apk")
          echo "$certs" | grep "SHA-256 digest"
          if ! grep -q "SHA-256 digest: $RELEASE_CERT_SHA256" <<< "$certs"; then
            echo "::error::The APK is not signed with the release key (check the RELEASE_* secrets)"
            exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="smwc-backlog-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
